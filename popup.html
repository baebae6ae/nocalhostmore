<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nocalhostmore</title>
    <link rel="stylesheet" href="assets/components.css" />
    <link rel="stylesheet" href="assets/popup.css" />
  </head>
  <body>
    <div id="app">
      <!-- 헤더 -->
      <header class="app-header">
        <div class="brand">
          <img src="icons/icon48.png" alt="" class="brand-logo" />
          <div class="brand-text">
            <h1>nocalhostmore</h1>
            <p>체크리스트</p>
          </div>
        </div>
        <div class="progress">
          <div
            class="progress-bar"
            id="progressBar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          ></div>
        </div>
      </header>

      <!-- 본문(질문/결과가 렌더링되는 영역) -->
      <main id="screen" class="screen"></main>

      <!-- 푸터 -->
      <footer class="app-footer">
        <button id="backBtn" class="btn-ghost" hidden>← 이전</button>
        <span id="stepLabel" class="step-label"></span>
      </footer>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
